.1216" y="270.9639">Apply file policy</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="321.7607" x="29.39" y="300.0318">validate name, size, date, and management flags</text></g><g class="entity" data-qualified-name="Open" data-source-line="29" id="ent0003"><rect fill="#F8FAFC" height="58.1358" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="282.919" x="53.81" y="384.9979"/><line style="stroke:#334155;stroke-width:0.5;" x1="53.81" x2="336.729" y1="414.0658" y2="414.0658"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.9036" x="138.3177" y="404.9639">Open destination</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.919" x="58.81" y="434.0318">create, truncate, or append for recovery</text></g><g class="entity" data-qualified-name="AwaitHeader" data-source-line="33" id="ent0004"><rect fill="#F8FAFC" height="115.3396" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="344.6588" x="22.94" y="541.3979"/><line style="stroke:#334155;stroke-width:0.5;" x1="22.94" x2="367.5988" y1="570.4658" y2="570.4658"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.5375" x="125.5006" y="561.3639">Await ZDATA or ZEOF</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238.3351" x="27.94" y="590.4318">TIMEOUT [errors &lt; 10] / send ZRPOS</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="324.6588" x="27.94" y="609.4997">repeated ZFILE / consume metadata; send ZRPOS</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="267.567" x="27.94" y="628.5676">mismatched ZDATA / purge; send ZRPOS</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.4253" x="27.94" y="647.6355">mismatched ZEOF / ignore</text></g><g class="entity" data-qualified-name="Receive" data-source-line="41" id="ent0005"><rect fill="#F8FAFC" height="96.2717" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="294.5529" x="737.28" y="332.9279"/><line style="stroke:#334155;stroke-width:0.5;" x1="737.28" x2="1031.8329" y1="361.9958" y2="361.9958"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.2953" x="788.9088" y="352.8939">Verify and commit subpacket</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274.5529" x="742.28" y="381.9618">decode escapes; verify CRC; write payload</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257.5989" x="742.28" y="401.0297">ZCRCG / continue current ZDATA frame</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="256.283" x="742.28" y="420.0976">ZCRCQ / send ZACK(new pos); continue</text></g><g class="entity" data-qualified-name="ReturnToHeader" data-source-line="47" id="ent0006"><rect fill="#F8FAFC" height="96.2717" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="242.0251" x="763.55" y="562.9279"/><line style="stroke:#334155;stroke-width:0.5;" x1="763.55" x2="1005.5751" y1="591.9958" y2="591.9958"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.8094" x="811.6578" y="582.8939">Return to header scan</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.4254" x="768.55" y="611.9618">ZCRCE / frame ended</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222.0251" x="768.55" y="631.0297">ZCRCW / send ZACK; frame ended</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="214.8152" x="768.55" y="650.0976">invalid data / purge; send ZRPOS</text></g><g class="entity" data-qualified-name="Finalize" data-source-line="53" id="ent0007"><rect fill="#F8FAFC" height="58.1358" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="267.239" x="750.94" y="693.9979"/><line style="stroke:#334155;stroke-width:0.5;" x1="750.94" x2="1018.179" y1="723.0658" y2="723.0658"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.8955" x="821.1118" y="713.9639">Finalize destination</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247.239" x="755.94" y="743.0318">verify position; flush; close; set mtime</text></g><rect fill="#F8FAFC" height="40" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="105.7316" x="831.69" y="844.0679"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.7316" x="836.69" y="869.4999">File succeeded</text><g class="entity" data-qualified-name="Skipped" data-source-line="58" id="ent0009"><rect fill="#F8FAFC" height="58.1358" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="181.7694" x="793.68" y="239.9979"/><line style="stroke:#334155;stroke-width:0.5;" x1="793.68" x2="975.4494" y1="269.0658" y2="269.0658"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.5457" x="845.7918" y="259.9639">File skipped</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.7694" x="798.68" y="289.0318">return RECEIVE_SKIPPED</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="16" id="ent0010"><ellipse cx="195.27" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="60" id="ent0022"><ellipse cx="884.56" cy="798.0679" fill="none" rx="11" ry