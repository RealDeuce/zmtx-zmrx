name: Build and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu with GCC
            runner: ubuntu-latest
            compiler: gcc
          - name: Ubuntu with Clang
            runner: ubuntu-latest
            compiler: clang
          - name: macOS with Clang
            runner: macos-latest
            compiler: clang

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -O2 -Wall -Wextra -Werror -pedantic-errors
        run: make check check-install

  quality:
    name: High-integrity quality gates on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Static analysis
        run: make check-static

      - name: Sanitizers
        run: make check-sanitize

      - name: Fuzz smoke test
        run: make check-fuzz

      - name: Reduced-memory profile
        run: make check-reduced

      - name: Structural coverage
        run: make coverage

  link:
    name: Link recovery and interoperability
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install lrzsz
        run: sudo apt-get update && sudo apt-get install -y lrzsz

      - name: Run link tests
        env:
          CFLAGS: -O2 -Wall -Wextra -Werror -pedantic-errors
          LSZ: sz
          LRZ: rz
        run: make check-link

  cpm:
    name: Z88DK CP/M build and tnylpo transfers
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build CP/M programs with Z88DK 2.4
        run: |
          docker run --rm \
            --volume "${PWD}:/src" --workdir /src \
            z88dk/z88dk:2.4 make -f makefile.cpm

      - name: Build native programs and test emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev
          git clone --branch 1.2 --depth 1 \
            https://gitlab.com/gbrein/tnylpo.git /tmp/tnylpo
          patch --directory=/tmp/tnylpo --strip=1 \
            < tests/tnylpo-unbuffered-output.patch
          make --directory=/tmp/tnylpo tnylpo
          make all
          CPM_BUILD_DIR=build/cpm TNYLPO=/tmp/tnylpo/tnylpo \
            python3 tests/test_cpm.py

  dos:
    name: Open Watcom 16-bit DOS build and DOSBox transfers
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Cache Open Watcom
        id: watcom-cache
        uses: actions/cache@v5
        with:
          path: ~/watcom
          key: open-watcom-c-2026-08-01

      - name: Install Open Watcom 2.0
        if: steps.watcom-cache.outputs.cache-hit != 'true'
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0'
          tag: 2026-08-01-Build
          target: dos
          environment: false

      - name: Configure Open Watcom environment
        run: |
          echo "WATCOM=$HOME/watcom" >> "$GITHUB_ENV"
          echo "INCLUDE=$HOME/watcom/h" >> "$GITHUB_ENV"
          echo "$HOME/watcom/binl" >> "$GITHUB_PATH"

      - name: Build native and 16-bit DOS programs
        run: |
          make all
          wmake -f makefile.dos check

      - name: Install DOSBox and obtain X00 1.50
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox unzip
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/deadbeatz/mystic_a45/4df1f1fef349e2b192f6dbe2b29717bcd6742314/dosemu/drive_c/x00/x00150.zip \
            --output /tmp/x00150.zip
          echo '4577e1ad1d89a65209ca3b2be9522191c4c25119c9de4938adb2dd4f5a819eab  /tmp/x00150.zip' \
            | sha256sum --check
          unzip -p /tmp/x00150.zip X00.SYS > build/dos/X00.EXE

      - name: Test BIOS, UART, and FOSSIL transfers in DOSBox
        run: wmake -f makefile.dos check-emulator

  win95:
    name: Open Watcom Windows 95 build and transport tests
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Open Watcom 2.0
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0'
          tag: 2026-08-01-Build
          target: nt

      - name: Build and test Windows 95 programs
        run: wmake -f makefile.win95 check-runtime MKDIR=mkdir

  release:
    name: Package source release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - cpm
      - dos
      - win95
      - link
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Create source archive
        id: package
        shell: bash
        run: |
          version=$(<VERSION)
          tag_version=${GITHUB_REF_NAME#v}

          if [[ "${tag_version}" != "${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi

          release_version=${version//./}
          if [[ ! "${release_version}" =~ ^[0-9]+$ ]]; then
            echo "VERSION must contain only digits and periods" >&2
            exit 1
          fi

          awk -v version="${version}" '
            BEGIN { heading = version " release notes (" }
            index($0, heading) == 1 { found = 1 }
            found && index($0, heading) != 1 &&
              $0 ~ /^[0-9]+\.[0-9]+ release notes \(/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' release.notes > RELEASE_NOTES

          zip_archive="zm${release_version}"
          tar_archive="zmtx-zmrx-${version}"

          git archive --format=zip --prefix="zmtx-zmrx/" \
            --output="${zip_archive}.zip" "${GITHUB_SHA}"
          git archive --format=tar --prefix="${tar_archive}/" "${GITHUB_SHA}" |
            gzip -n -9 > "${tar_archive}.tar.gz"
          sha256sum "${zip_archive}.zip" "${tar_archive}.tar.gz" > SHA256SUMS

          echo "zip_archive=${zip_archive}" >> "${GITHUB_OUTPUT}"
          echo "tar_archive=${tar_archive}" >> "${GITHUB_OUTPUT}"

      - name: Retain packaged source as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.tar_archive }}-source
          path: |
            ${{ steps.package.outputs.zip_archive }}.zip
            ${{ steps.package.outputs.tar_archive }}.tar.gz
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAR_ARCHIVE: ${{ steps.package.outputs.tar_archive }}
          ZIP_ARCHIVE: ${{ steps.package.outputs.zip_archive }}
        shell: bash
        run: |
          assets=("${ZIP_ARCHIVE}.zip" "${TAR_ARCHIVE}.tar.gz" SHA256SUMS)

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES \
              --title "${GITHUB_REF_NAME}"
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag --notes-file RELEASE_NOTES \
              --title "${GITHUB_REF_NAME}"
          fi
